name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *" # monthly, to catch breakage from new napari/omero-py releases
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests run against the latest dependencies, like a fresh user install.
# Every platform is tested once per tool, because each tool gets
# zeroc-ice/Qt binaries from a different place; the Python range is covered on
# Linux only.
# uv: Glencoe zeroc-ice wheels (py3.10-3.12)
# pixi: conda-forge (py3.13+).
jobs:
  test-uv:
    name: uv ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" } # oldest Python -> older napari
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv run --upgrade pytest tests/local --color=yes

  test-pixi:
    name: pixi ${{ matrix.os }} ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, env: py313 }
          - { os: ubuntu-latest, env: py314 }
          - { os: macos-latest, env: py314 }
          - { os: windows-latest, env: py314 }
    steps:
      - uses: actions/checkout@v7
      - uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - run: pixi update -e ${{ matrix.env }} # latest deps instead of pixi.lock
      - run: pixi run -e ${{ matrix.env }} test tests/local --color=yes

  # Integration tests against a real, containerized OMERO server.
  # Kept as a separate job (single OS + Python) so the server stack is only
  # started once, rather than across the full test matrix.
  test-server:
    name: server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: "latest"
          python-version: "3.12"

      # the server test for the browser widget needs a Qt backend + display
      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true

      - name: Install dependencies
        run: |
          conda install omero-py
          python -m pip install --upgrade pip
          python -m pip install .[test]
          python -m pip install PyQt5

      - name: Set up OMERO server
        run: |
          # omero-test-infra is used only to stand up a server stack (compose up);
          # Pinned to latest commit: Dec 2025
          git clone https://github.com/ome/omero-test-infra .omero
          git -C .omero checkout c8a0015b0ce72ee0a49e6968af33de10ea00bc77
          # Bind the server/web ports to fixed host ports so the host-side tests
          # can reach localhost:4064 / :4080 (compose defaults to random ports).
          # see also: https://github.com/ome/omero-test-infra/issues/77
          echo 'OMERO_SERVER_SSL=4064:' >> .omero/.env
          echo 'OMERO_WEB_PORT=4080:' >> .omero/.env
          .omero/compose up -d
          .omero/wait-on-login

      - name: Test (server)
        run: pytest ./tests/server --color=yes --cov=napari_omero --cov-report=xml

  deploy:
    # runs when a tag starting with "v" is pushed; publishes via PyPI trusted publishing
    needs: [test-uv, test-pixi, test-server]
    if: success() && startsWith(github.ref, 'refs/tags/') && github.repository == 'ome/napari-omero'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: "./dist/*"
